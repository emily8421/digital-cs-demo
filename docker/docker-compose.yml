# 本机原型用：起一个 PostgreSQL 即可。
# Sprint-1 不需要 pgvector（知识库向量在 Sprint-2 加入时再换 pgvector 镜像）。
services:
  db:
    image: postgres:16
    container_name: dcs-db
    environment:
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: dcs
      POSTGRES_DB: dcs
    ports:
      - "15432:5432"  # 宿主机用 15432（避开 Windows Hyper-V 对 5432 的端口预留）
    volumes:
      - dcs_pgdata:/var/lib/postgresql/data

volumes:
  dcs_pgdata:
