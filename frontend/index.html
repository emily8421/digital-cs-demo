<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>数字客服 Demo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f5f5f5; display: flex; height: 100vh; height: 100dvh; }
  .chat { flex: 2; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #ededed; min-width: 0; }
  .chat-header { padding: 10px 14px; background: #07c160; color: #fff; font-weight: bold; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .chat-header .right { margin-left: auto; display: flex; gap: 6px; }
  .chat-header button { background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
  .convtag { background: rgba(255,255,255,.25); padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: normal; }
  .messages { flex: 1; overflow-y: auto; padding: 14px; }
  .bubble { max-width: 78%; padding: 8px 12px; border-radius: 8px; margin: 6px 0; word-break: break-word; font-size: 14px; line-height: 1.5; position: relative; }
  .bubble.cust { background: #fff; border: 1px solid #eee; margin-right: auto; }
  .bubble.ai { background: #95ec69; color: #000; margin-left: auto; }
  .bubble.sys { background: #fff3cd; color: #856404; margin-left: auto; font-size: 13px; }
  .bubble .ts { display: block; font-size: 10px; color: #999; margin-top: 3px; text-align: right; }
  .bubble.sys .ts { color: #b8860b; }
  .replay { float: right; margin-left: 8px; background: #f0f0f0; color: #888; border: none; border-radius: 3px; padding: 1px 6px; font-size: 11px; cursor: pointer; }
  .replay:hover { background: #07c160; color: #fff; }
  .input { display: flex; padding: 8px; border-top: 1px solid #ddd; background: #f7f7f7; gap: 6px; }
  .input input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; min-width: 0; }
  .input button { padding: 8px 14px; background: #07c160; color: #fff; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .input .ico { padding: 8px 10px; background: #fff; color: #333; border: 1px solid #ddd; font-size: 16px; }
  .side { flex: 1; padding: 14px; overflow-y: auto; min-width: 260px; max-width: 380px; }
  .side h3 { margin-top: 0; font-size: 15px; }
  .side section { background: #fff; padding: 11px; margin-bottom: 11px; border-radius: 6px; border: 1px solid #eee; }
  .side section b { font-size: 13px; }
  .side input, .side select { padding: 6px; margin: 4px 0; width: 100%; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
  .side button { padding: 6px 12px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 4px; font-size: 13px; }
  .result { font-size: 12px; color: #444; margin-top: 6px; max-height: 200px; overflow-y: auto; }
  .tip { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.5; }
  /* 飞书卡片样式（转交通知） */
  .card { border: 1px solid #e1e4e8; border-left: 3px solid #07c160; border-radius: 6px; padding: 8px 10px; background: #fafbfc; }
  .card-title { font-weight: bold; margin-bottom: 5px; color: #07c160; }
  .card-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 12px; }
  .card-row span { color: #888; }
  .card-body { margin-top: 5px; padding-top: 5px; border-top: 1px dashed #e1e4e8; color: #333; line-height: 1.5; }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    .chat { border-right: none; border-bottom: 1px solid #ddd; flex: none; height: 58vh; }
    .side { min-width: 0; max-width: none; flex: 1; }
  }
</style>
</head>
<body>
<div class="chat">
  <div class="chat-header">
    <span>客户群：demo_ui（模拟器通道）</span>
    <span id="curconv" class="convtag"></span>
    <span class="right">
      <button onclick="replayDemo()" title="一键重放完整 Demo">▶ 重放 Demo</button>
      <button onclick="clearHist()" title="清空聊天">清空</button>
    </span>
  </div>
  <div class="messages" id="msgs"></div>
  <div class="input">
    <input id="text" placeholder="如「5050和2835区别」「能做IP67吗」「订货电话13912345678」…" onkeydown="if(event.key==='Enter')send()">
    <button class="ico" onclick="sendNon('voice')" title="发一条语音">🎤</button>
    <button class="ico" onclick="sendNon('image')" title="发一张图片">🖼</button>
    <button onclick="send()">发送</button>
  </div>
</div>
<div class="side">
  <h3>演示控制台</h3>
  <section>
    <b>知识检索（REQ-2/3）</b>
    <input id="q" placeholder="如：能做IP67吗">
    <button onclick="search()">检索</button>
    <div class="result" id="r-search"></div>
  </section>
  <section>
    <b>转人工转交（REQ-5/8）</b>
    <input id="h-cid" placeholder="会话 ID（见聊天标题）">
    <select id="h-scen">
      <option value="presale">售前 presale → sales</option>
      <option value="unknown_question">待确认 unknown_question → owner</option>
      <option value="order">订单 order → merchandiser</option>
      <option value="aftersale">售后 aftersale → tech</option>
    </select>
    <input id="h-reason" placeholder="转交原因">
    <button onclick="handoff()">转交</button>
    <div class="result" id="r-handoff"></div>
  </section>
  <section>
    <b>定时小结（REQ-7）</b>
    <button onclick="summary()">生成经营者小结</button>
    <div class="result" id="r-summary"></div>
  </section>
  <section>
    <b>转人工暂停（REQ-10）</b>
    <input id="s-cid" placeholder="会话 ID">
    <select id="s-state">
      <option value="handed_off">置 handed_off（暂停 AI）</option>
      <option value="auto">置 auto（恢复）</option>
    </select>
    <button onclick="setstate()">设置</button>
    <div class="result" id="r-state"></div>
  </section>
  <div class="tip">前置：docker compose up -d + uvicorn。聊天历史自动存浏览器（刷新不丢）。真机调见下方说明。</div>
</div>
<script>
const B = '/api/v1';
const GROUP = 'demo_ui', SENDER = 'cust_demo';
const HKEY = 'demo_ui_history';
function now() { return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function saveHist() { try { localStorage.setItem(HKEY, document.getElementById('msgs').innerHTML); } catch(e){} }
function loadHist() { try { const h = localStorage.getItem(HKEY); if (h) document.getElementById('msgs').innerHTML = h; } catch(e){} }
function clearHist() { localStorage.removeItem(HKEY); location.reload(); }
function setConv(id) { document.getElementById('curconv').textContent = id ? ('会话 #' + id) : ''; }
function bubble(cls, html) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.innerHTML = html;
  const m = document.getElementById('msgs');
  m.appendChild(d);
  m.scrollTop = m.scrollHeight;
  saveHist();
}
function custBubble(label, type, content) {
  const rep = '<button class="replay" data-type="'+type+'" data-content="'+esc(content||'')+'" title="重放">↻</button>';
  bubble('cust', rep + esc(label) + '<span class="ts">' + now() + '</span>');
}
async function postSim(body, customerLabel, type, content) {
  custBubble(customerLabel, type, content);
  try {
    const r = await fetch(B + '/messages/simulate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const d = (await r.json()).data;
    setConv(d.conversation_id);
    if (d.reply_text) bubble('ai', esc(d.reply_text) + '<span class="ts">' + now() + '</span>');
    else bubble('sys', '[未自动回复]（可能已转人工暂停）<span class="ts">' + now() + '</span>');
    if (d.lead_id) bubble('sys', '📝 已记录留资 lead #' + d.lead_id + '<span class="ts">' + now() + '</span>');
    if (d.hit === false && d.handoff_id) bubble('sys', '⚠️ 知识缺口，已转交拍板人 handoff #' + d.handoff_id + '<span class="ts">' + now() + '</span>');
    if (d.hit === true) bubble('sys', '✓ 命中知识 #' + d.answer_source_id + '<span class="ts">' + now() + '</span>');
  } catch (e) { bubble('sys', '请求失败：' + e + '（后端起了吗？）'); }
}
async function send() {
  const t = document.getElementById('text').value.trim();
  if (!t) return;
  document.getElementById('text').value = '';
  await postSim({ external_group_id: GROUP, sender_external_id: SENDER, content_type: 'text', content_text: t }, t, 'text', t);
}
async function sendNon(ctype) {
  const label = ctype === 'voice' ? '🎤 [语音消息]' : '🖼 [图片消息]';
  await postSim({ external_group_id: GROUP, sender_external_id: SENDER, content_type: ctype, content_text: null }, label, ctype, '');
}
// 事件委托：点 ↻ 重放该客户消息
document.getElementById('msgs').addEventListener('click', function(e){
  const btn = e.target.closest('.replay'); if (!btn) return;
  const t = btn.dataset.type, c = btn.dataset.content;
  if (t === 'text' && c) { document.getElementById('text').value = c; send(); }
  else if (t === 'voice' || t === 'image') sendNon(t);
});
// 一键重放完整 Demo
async function replayDemo() {
  bubble('sys', '▶ 开始重放完整 Demo（03 §3 步骤 1-5）<span class="ts">' + now() + '</span>');
  const steps = [
    ['text', '5050和2835灯带有什么区别'],
    ['text', '你们灯带能用在海里潜水吗'],
    ['text', '满意，想订货，电话13912345678'],
    ['voice', ''],
  ];
  for (const [t, c] of steps) {
    if (t === 'text') await postSim({ external_group_id: GROUP, sender_external_id: SENDER, content_type: 'text', content_text: c }, c, 'text', c);
    else await sendNon(t);
  }
  bubble('sys', '✅ Demo 重放完成（侧栏点「生成经营者小结」看日报）<span class="ts">' + now() + '</span>');
}
async function search() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const r = await fetch(B + '/knowledge/search?' + new URLSearchParams({ q }));
  const d = (await r.json()).data;
  document.getElementById('r-search').textContent = d.hit
    ? ('命中 score=' + d.items[0].score + '\n' + d.items[0].answer)
    : '未命中 hit:false（走缺口流程）';
}
async function handoff() {
  const cid = +document.getElementById('h-cid').value;
  const scen = document.getElementById('h-scen').value;
  const reason = document.getElementById('h-reason').value || '演示转交';
  const r = await fetch(B + '/handoffs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversation_id: cid, scenario: scen, reason })
  });
  const d = (await r.json()).data;
  // 飞书卡片样式
  document.getElementById('r-handoff').innerHTML =
    '<div class="card">' +
    '<div class="card-title">🔔 转交通知 #' + d.handoff_id + '</div>' +
    '<div class="card-row"><span>场景</span><b>' + esc(scen) + ' → ' + esc(d.target_role || '—') + '</b></div>' +
    '<div class="card-row"><span>转给</span><b>' + esc(d.staff_name || '待分配') + '</b></div>' +
    '<div class="card-row"><span>通知</span><b>#' + d.notification_id + '</b></div>' +
    '<div class="card-body">' + esc(d.body) + '</div>' +
    '</div>';
}
async function summary() {
  const r = await fetch(B + '/summaries/daily', { method: 'POST' });
  const d = (await r.json()).data;
  document.getElementById('r-summary').innerHTML =
    '<div class="card"><div class="card-title">📊 经营者小结 #' + d.notification_id + '</div><div class="card-body">' + esc(d.summary) + '</div></div>';
}
async function setstate() {
  const cid = +document.getElementById('s-cid').value;
  const st = document.getElementById('s-state').value;
  const r = await fetch(B + '/conversations/' + cid + '/handoff-state', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ handoff_state: st })
  });
  const d = (await r.json()).data;
  document.getElementById('r-state').textContent = '会话 ' + d.conversation_id + ' → ' + d.handoff_state;
}
loadHist();
</script>
</body>
</html>
