<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字客服 Demo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f5; display: flex; height: 100vh; }
  .chat { flex: 2; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #ededed; min-width: 0; }
  .chat-header { padding: 12px 16px; background: #07c160; color: #fff; font-weight: bold; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; }
  .bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; margin: 6px 0; word-break: break-word; font-size: 14px; line-height: 1.5; }
  .bubble.cust { background: #fff; border: 1px solid #eee; margin-right: auto; }
  .bubble.ai { background: #95ec69; color: #000; margin-left: auto; }
  .bubble.sys { background: #fff3cd; color: #856404; margin-left: auto; font-size: 13px; }
  .input { display: flex; padding: 8px; border-top: 1px solid #ddd; background: #f7f7f7; }
  .input input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
  .input button { margin-left: 8px; padding: 8px 16px; background: #07c160; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .side { flex: 1; padding: 14px; overflow-y: auto; min-width: 260px; }
  .side h3 { margin-top: 0; font-size: 16px; }
  .side section { background: #fff; padding: 12px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #eee; }
  .side section b { font-size: 14px; }
  .side input, .side select { padding: 6px; margin: 4px 0; width: 100%; border: 1px solid #ddd; border-radius: 4px; }
  .side button { padding: 6px 12px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 4px; }
  .result { font-size: 13px; color: #444; margin-top: 6px; white-space: pre-wrap; background: #f9f9f9; padding: 6px; border-radius: 4px; max-height: 160px; overflow-y: auto; }
  .tip { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<div class="chat">
  <div class="chat-header">客户群：demo_ui（模拟器通道 · 客户视角）</div>
  <div class="messages" id="msgs">
    <div class="bubble sys">提示：在下方输入客户消息，系统会自动检索作答 / 请留资 / 转交。右侧控制台可单独触发检索、转交、小结、暂停。</div>
  </div>
  <div class="input">
    <input id="text" placeholder="输入客户消息，如「5050和2835区别」「能做IP67吗」「订货电话13912345678」…" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>
<div class="side">
  <h3>演示控制台</h3>
  <section>
    <b>知识检索（REQ-2/3）</b>
    <input id="q" placeholder="如：5050和2835区别">
    <button onclick="search()">检索</button>
    <div class="result" id="r-search"></div>
  </section>
  <section>
    <b>转人工转交（REQ-5/8）</b>
    <input id="h-cid" placeholder="会话 ID（见聊天上方提示）">
    <select id="h-scen">
      <option value="presale">售前 presale → sales</option>
      <option value="unknown_question">待确认 unknown_question → owner</option>
      <option value="order">订单 order → merchandiser</option>
      <option value="aftersale">售后 aftersale → tech</option>
    </select>
    <input id="h-reason" placeholder="转交原因">
    <button onclick="handoff()">转交</button>
    <div class="result" id="r-handoff"></div>
  </section>
  <section>
    <b>定时小结（REQ-7）</b>
    <button onclick="summary()">生成经营者小结</button>
    <div class="result" id="r-summary"></div>
  </section>
  <section>
    <b>转人工暂停（REQ-10）</b>
    <input id="s-cid" placeholder="会话 ID">
    <select id="s-state">
      <option value="handed_off">置 handed_off（暂停 AI）</option>
      <option value="auto">置 auto（恢复）</option>
    </select>
    <button onclick="setstate()">设置</button>
    <div class="result" id="r-state"></div>
  </section>
  <div class="tip">前置：docker compose up -d + uvicorn（见 README）。本页连 localhost:8000。</div>
</div>
<script>
const B = '/api/v1';
const GROUP = 'demo_ui', SENDER = 'cust_demo';
function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'bubble ' + cls;
  d.textContent = text;
  const m = document.getElementById('msgs');
  m.appendChild(d);
  m.scrollTop = m.scrollHeight;
}
async function send() {
  const t = document.getElementById('text').value.trim();
  if (!t) return;
  document.getElementById('text').value = '';
  bubble('cust', t);
  try {
    const r = await fetch(B + '/messages/simulate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ external_group_id: GROUP, sender_external_id: SENDER, content_type: 'text', content_text: t })
    });
    const d = (await r.json()).data;
    if (d.reply_text) {
      bubble('ai', d.reply_text);
    } else {
      bubble('sys', '[未自动回复] conv=' + d.conversation_id + '（可能已转人工暂停）'
        + (d.lead_id ? '\n留资 lead_id=' + d.lead_id : '')
        + (d.hit === false ? '\n缺口 gap_id=' + d.gap_id : ''));
    }
  } catch (e) { bubble('sys', '请求失败：' + e + '（后端起了吗？）'); }
}
async function search() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const r = await fetch(B + '/knowledge/search?' + new URLSearchParams({ q }));
  const d = (await r.json()).data;
  document.getElementById('r-search').textContent = d.hit
    ? ('命中 score=' + d.items[0].score + '\n' + d.items[0].answer)
    : '未命中 hit:false（走缺口流程）';
}
async function handoff() {
  const cid = +document.getElementById('h-cid').value;
  const scen = document.getElementById('h-scen').value;
  const reason = document.getElementById('h-reason').value || '演示转交';
  const r = await fetch(B + '/handoffs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversation_id: cid, scenario: scen, reason })
  });
  const d = (await r.json()).data;
  document.getElementById('r-handoff').textContent =
    'handoff=' + d.handoff_id + ' → ' + d.target_role + '/' + d.staff_name + '\n通知：' + d.body;
}
async function summary() {
  const r = await fetch(B + '/summaries/daily', { method: 'POST' });
  const d = (await r.json()).data;
  document.getElementById('r-summary').textContent = d.summary;
}
async function setstate() {
  const cid = +document.getElementById('s-cid').value;
  const st = document.getElementById('s-state').value;
  const r = await fetch(B + '/conversations/' + cid + '/handoff-state', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ handoff_state: st })
  });
  const d = (await r.json()).data;
  document.getElementById('r-state').textContent = '会话 ' + d.conversation_id + ' → ' + d.handoff_state;
}
</script>
</body>
</html>
